<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffdf7d">
    <meta name="description" content="Historias y actividades cristianas con Escalito y sus amigos para expresar sentimientos, cuidarnos y pedir ayuda.">
    <link rel="icon" href="/icons/launcher-192.png" type="image/png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>SCALA Pequeños Valientes</title>
    <style>html,body{margin:0;background:#fff4dc;color:#38271b}#launch-brand{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 36%,#fff8e7d9 0%,#fff5ded4 17%,#ffefc939 58%,#fbd8a329 100%),url('/backgrounds/urban.webp') center 63%/cover;text-align:center;font-family:Manrope,system-ui,sans-serif}#launch-brand[hidden]{display:none}#launch-brand img{width:min(300px,82vw);height:auto;object-fit:contain;opacity:1;transform:none;animation:none;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 17px #fffffff2)}#launch-brand h1{margin:20px 0 8px;font-size:26px;line-height:1.2;letter-spacing:-.8px;color:#392d20;text-shadow:0 1px 8px #fff7e5}#launch-brand .welcome-subtitle{font-size:14px;margin:0 0 28px;color:#483520;text-shadow:0 1px 6px #fff}#launch-brand button{border:2px solid #fff3d6;background:linear-gradient(#ffce82,#ffb46c);color:#392417;border-radius:24px;padding:16px 28px;min-height:60px;font:800 18px Manrope,system-ui,sans-serif;box-shadow:0 5px 0 #c98945,0 10px 25px #75512e35;cursor:pointer}#launch-brand button:disabled{opacity:.6;cursor:wait}#launch-brand button:focus-visible{outline:4px solid #52319b;outline-offset:5px}#launch-brand .welcome-footer{position:absolute;bottom:calc(25px + env(safe-area-inset-bottom));margin:0;padding:10px 18px;border-radius:20px;background:#fff9eae8;font-size:12px;font-weight:500;letter-spacing:.9px;color:#282017;box-shadow:0 3px 14px #60482a16}@media(max-height:650px){#launch-brand img{width:min(210px,64vw)}#launch-brand h1{margin-top:14px;font-size:23px}#launch-brand .welcome-subtitle{margin-bottom:19px}}</style>
  </head>
  <body>
    <div id="launch-brand" aria-label="Bienvenida a Scala desarrollo cristiano">
      <img src="/brand/scala-original.png" alt="SCALA" width="2048" height="1638" fetchpriority="high">
      <h1>Pequeños Valientes</h1>
      <p class="welcome-subtitle">Tu voz importa. Aprendemos a cuidarnos.</p>
      <button id="enter-world" disabled>Preparando tu aventura…</button>
      <p class="welcome-footer">Scala desarrollo cristiano</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
