<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffdf7d">
    <meta name="description" content="Historias y actividades cristianas con Escalito y sus amigos para expresar sentimientos, cuidarnos y pedir ayuda.">
    <link rel="icon" href="/icons/launcher-192.png" type="image/png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>SCALA Pequeños Valientes</title>
    <style>html,body{margin:0;background:#fff4dc;color:#38271b}#launch-brand{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 39%,#fff2bb 0%,#ffdf7d 45%,#ffb58b 100%);text-align:center;font-family:Manrope,system-ui,sans-serif}#launch-brand[hidden]{display:none}#launch-brand img{width:min(288px,80vw);height:auto;object-fit:contain;opacity:1;transform:none;animation:none;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 17px #ffffffde)}#launch-brand h1{margin:22px 0 8px;font-size:26px;line-height:1.2;letter-spacing:-.8px}#launch-brand .welcome-subtitle{font-size:14px;margin:0 0 28px}#launch-brand button{border:2px solid #fff4db;background:#ed7352;color:#392417;border-radius:24px;padding:16px 28px;min-height:60px;font:800 18px Manrope,system-ui,sans-serif;box-shadow:0 6px 0 #bb4b32,0 12px 20px #a8572830;cursor:pointer}#launch-brand button:disabled{opacity:.6;cursor:wait}#launch-brand button:focus-visible{outline:4px solid #52319b;outline-offset:5px}#launch-brand .welcome-footer{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:20px;right:20px;margin:0;font-size:12px;font-weight:500;letter-spacing:.9px;color:#282017}#launch-brand::before,#launch-brand::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#fff5d548;pointer-events:none}#launch-brand::before{top:-80px;left:-65px}#launch-brand::after{bottom:-80px;right:-55px}</style>
  </head>
  <body>
    <div id="launch-brand" aria-label="Bienvenida a Scala desarrollo cristiano">
      <img src="/brand/scala-original.png" alt="SCALA" width="2048" height="1638" fetchpriority="high">
      <h1>Pequeños Valientes</h1>
      <p class="welcome-subtitle">Tu voz importa. Aprendemos a cuidarnos.</p>
      <button id="enter-world" disabled>Preparando tu aventura…</button>
      <p class="welcome-footer">Scala desarrollo cristiano</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
