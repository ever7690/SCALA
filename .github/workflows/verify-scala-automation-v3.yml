name: Verify SCALA Automation PRO V3

on:
  push:
    branches: [ "scala-automation-pro-v3" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validation payload
        uses: actions/checkout@v4

      - name: Reconstruct exact V3 package
        shell: bash
        run: |
          set -euo pipefail
          cat ci/v3/part*.b64 > /tmp/scala-v3.b64
          base64 -d /tmp/scala-v3.b64 > /tmp/SCALA-AUTOMATION-PRO-V3.zip
          echo "f92235869e61e193ca5d26d2a6816585747474ed927023666ce1f7ceebdd42e5  /tmp/SCALA-AUTOMATION-PRO-V3.zip" | sha256sum -c -
          unzip -q /tmp/SCALA-AUTOMATION-PRO-V3.zip -d /tmp/scala-v3
          test -f /tmp/scala-v3/SCALA-AUTOMATION-PRO-V3/docker-compose.yml

      - name: Static and unit validation
        shell: bash
        working-directory: /tmp/scala-v3/SCALA-AUTOMATION-PRO-V3
        run: |
          set -euo pipefail
          node tests/control_center_test.mjs
          node tests/action_engine_test.mjs
          python3 tests/static_check.py
          python3 - <<'PY'
          import yaml
          for p in ["docker-compose.yml","routes/gateway.camel.yaml","routes/worker.camel.yaml"]:
              with open(p,encoding="utf-8") as f:
                  yaml.safe_load(f)
              print("YAML_OK",p)
          PY
          for f in *.sh; do bash -n "$f"; done
          node --check action-engine/server.mjs
          node --check control-center/server.mjs
          node --check tests/mock_ai.mjs

      - name: Configure isolated cloud test
        shell: bash
        working-directory: /tmp/scala-v3/SCALA-AUTOMATION-PRO-V3
        run: |
          set -euo pipefail
          cp .env.example .env
          python3 - <<'PY'
          from pathlib import Path
          p=Path(".env")
          lines=p.read_text().splitlines()
          vals={
            "SCALA_AI_URL":"http://mock-ai:11434",
            "SCALA_AI_HOST_URL":"http://127.0.0.1:11434",
            "N8N_BASE_URL":"http://mock-ai:11434",
            "ARTEMIS_PASSWORD":"SCALA_CI_ARTEMIS_2026",
            "HTTP_ALLOW_HOSTS":"mock-ai",
            "SCALA_TEST_HTTP_URL":"http://mock-ai:11434/health",
            "WORKER_REPLICAS":"2"
          }
          seen=set(); out=[]
          for line in lines:
            if "=" in line and not line.lstrip().startswith("#"):
              k=line.split("=",1)[0]
              if k in vals:
                out.append(f"{k}={vals[k]}"); seen.add(k); continue
            out.append(line)
          for k,v in vals.items():
            if k not in seen: out.append(f"{k}={v}")
          p.write_text("\n".join(out)+"\n")
          PY
          mkdir -p data/jobs data/results data/failed data/requests data/audit data/user-files config
          cp -n config/secrets.example.json config/secrets.json || true
          cp -n config/workflows.example.json config/workflows.json || true
          cp -n config/hooks.example.json config/hooks.json || true
          cp -n config/schedules.example.json config/schedules.json || true
          chmod +x *.sh

      - name: Start full runtime
        shell: bash
        working-directory: /tmp/scala-v3/SCALA-AUTOMATION-PRO-V3
        run: |
          set -euo pipefail
          docker compose --profile test pull
          docker compose --profile test up -d artemis mock-ai action-engine gateway control-center
          docker compose up -d --scale worker=2 worker
          docker compose ps

      - name: Full end-to-end verification
        shell: bash
        working-directory: /tmp/scala-v3/SCALA-AUTOMATION-PRO-V3
        run: |
          set -euo pipefail
          ./VERIFICAR.sh | tee /tmp/scala-v3-verification.txt
          grep -Fxq 'SCALA_AUTOMATION_PRO=VERIFICADO' /tmp/scala-v3-verification.txt

      - name: Collect diagnostics
        if: always()
        shell: bash
        working-directory: /tmp/scala-v3/SCALA-AUTOMATION-PRO-V3
        run: |
          {
            echo "=== docker compose ps ==="
            docker compose --profile test ps || true
            echo "=== gateway ==="
            docker compose logs --tail=250 gateway || true
            echo "=== worker ==="
            docker compose logs --tail=250 worker || true
            echo "=== action-engine ==="
            docker compose logs --tail=250 action-engine || true
            echo "=== artemis ==="
            docker compose logs --tail=250 artemis || true
          } | tee /tmp/scala-v3-diagnostics.txt
          docker compose --profile test down -v || true

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SCALA-AUTOMATION-PRO-V3-verification
          path: |
            /tmp/scala-v3-verification.txt
            /tmp/scala-v3-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 30
