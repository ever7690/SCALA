name: SCALA Palabras de Fe Android
on:
  push:
    branches: [scala/bible-word-puzzle]
    paths:
      - games/SCALA_Palabras_de_Fe/**
      - .github/workflows/scala-words-android.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scala-words-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: games/SCALA_Palabras_de_Fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: games/SCALA_Palabras_de_Fe/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Preparar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Dependencias
        run: npm ci
      - name: Comprobar código y 1000 niveles
        run: npm run check && npm test
      - name: Generar juego sin conexión
        run: npm run build
      - name: Compilar APK
        run: |
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleRelease
      - name: Preparar entrega
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk entregables/SCALA_Palabras_de_Fe_1.0.0_pruebas.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk entregables/SCALA_Palabras_de_Fe_1.0.0_sin_firmar.apk
          sha256sum entregables/*.apk > entregables/SHA256SUMS.txt
          printf '%s\n' "Commit: $GITHUB_SHA" "Compilación: $GITHUB_RUN_ID" > entregables/COMPILACION.txt
      - name: Verificar interfaz y guardado
        run: npx playwright install --with-deps chromium && npm run test:ui
      - name: Entregar APK y verificaciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SCALA-Palabras-de-Fe-1.0.0
          path: games/SCALA_Palabras_de_Fe/entregables/
          retention-days: 30
          if-no-files-found: error
