name: ASHER Wallpaper Replacement Test

on:
  push:
    paths:
      - 'tools/SCALA_RECUPERAR_ASHER_v1.3_REPLACE_WALLPAPERS.sh'
      - '.github/workflows/asher-recovery-delete-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install wimtools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wimtools shellcheck

      - name: Validate script syntax
        run: |
          bash -n tools/SCALA_RECUPERAR_ASHER_v1.3_REPLACE_WALLPAPERS.sh
          shellcheck -e SC2016,SC2034,SC2155 tools/SCALA_RECUPERAR_ASHER_v1.3_REPLACE_WALLPAPERS.sh

      - name: Verify wallpaper replacement not duplication
        shell: bash
        run: |
          set -Eeuo pipefail
          T="$RUNNER_TEMP/t"
          mkdir -p "$T/root/Windows/Web/Wallpaper/Windows"
          mkdir -p "$T/root/SCALA/ASHERIMAGENES"
          mkdir -p "$T/root/Windows/Setup/Scripts"

          # Simulate original Windows wallpapers larger than the user's 5-image pack.
          dd if=/dev/urandom of="$T/root/Windows/Web/Wallpaper/Windows/default1.jpg" bs=1M count=8 status=none
          dd if=/dev/urandom of="$T/root/Windows/Web/Wallpaper/Windows/default2.jpg" bs=1M count=8 status=none

          printf 'old user script C:\\SCALA\\ASHERIMAGENES\n' > "$T/root/SCALA/USER_SCALA.ps1"
          printf 'dedication\n' > "$T/root/SCALA/DEDICATORIA.txt"
          printf '@echo off\r\nexit /b 0\r\n' > "$T/root/Windows/Setup/Scripts/SetupComplete.cmd"

          mkdir -p "$T/newimages"
          for n in 1 2 3 4 5; do
            dd if=/dev/urandom of="$T/newimages/asher$n.jpg" bs=1M count=1 status=none
          done
          printf 'new user script C:\\Windows\\Web\\Wallpaper\\ASHER\n' > "$T/USER_SCALA_REPLACEMENT.ps1"

          wimlib-imagex capture "$T/root" "$T/work.wim" "test" --compress=LZX --check
          BEFORE="$(stat -c '%s' "$T/work.wim")"

          cat > "$T/update.txt" <<EOF
delete --recursive --force /SCALA/ASHERIMAGENES
delete --recursive --force /Windows/Web/Wallpaper
delete --force /SCALA/USER_SCALA.ps1
add "$T/newimages" /Windows/Web/Wallpaper/ASHER
add "$T/USER_SCALA_REPLACEMENT.ps1" /SCALA/USER_SCALA.ps1
EOF

          wimlib-imagex update "$T/work.wim" 1 --check < "$T/update.txt"
          wimlib-imagex verify "$T/work.wim"

          # Old Windows wallpaper path must be gone.
          if wimlib-imagex dir "$T/work.wim" 1 --path=/Windows/Web/Wallpaper/Windows >/dev/null 2>&1; then
            echo "Old Windows wallpaper folder still exists"
            exit 1
          fi

          # All five ASHER images must exist.
          for n in 1 2 3 4 5; do
            wimlib-imagex dir "$T/work.wim" 1 --path="/Windows/Web/Wallpaper/ASHER/asher$n.jpg" >/dev/null
          done

          # SCALA core must remain.
          wimlib-imagex dir "$T/work.wim" 1 --path=/SCALA/DEDICATORIA.txt >/dev/null
          wimlib-imagex dir "$T/work.wim" 1 --path=/SCALA/USER_SCALA.ps1 >/dev/null
          wimlib-imagex dir "$T/work.wim" 1 --path=/Windows/Setup/Scripts/SetupComplete.cmd >/dev/null

          wimlib-imagex export "$T/work.wim" all "$T/final.esd" --compress=LZMS:100 --solid --check
          wimlib-imagex verify "$T/final.esd"

          echo "WALLPAPER REPLACEMENT TEST: PASS"
