name: SCALA Business AI Android
on:
  push:
    branches: [scala/business-ai]
    paths:
      - 'apps/SCALA_Business_AI/**'
      - '.github/workflows/scala-business-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Keep original SCALA logo and verify source
        run: |
          cp games/SCALA_Palabras_de_Fe/public/brand/scala-original.png apps/SCALA_Business_AI/app/src/main/assets/logo.png
          echo 'Logo SCALA SHA-256:'
          sha256sum apps/SCALA_Business_AI/app/src/main/assets/logo.png
          node apps/SCALA_Business_AI/tests/core.test.js
          node --check apps/SCALA_Business_AI/app/src/main/assets/app.js
      - name: Build Android APK
        working-directory: apps/SCALA_Business_AI
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify package and publish checksums
        working-directory: apps/SCALA_Business_AI
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SCALA-Business-AI-0.1.0-APK
          path: |
            apps/SCALA_Business_AI/app/build/outputs/apk/debug/app-debug.apk
            apps/SCALA_Business_AI/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
