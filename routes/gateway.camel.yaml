- route:
    id: scala-submit-job
    from:
      uri: "direct:submit-job"
      steps:
        - convertBodyTo: { type: java.lang.String }
        - setHeader: { name: scalaJobId, expression: { simple: { expression: "${uuid}" } } }
        - setHeader: { name: JMSCorrelationID, expression: { simple: { expression: "${header.scalaJobId}" } } }
        - setHeader: { name: scalaSubmittedAt, expression: { simple: { expression: "${date:now:yyyy-MM-dd-T-HH:mm:ss.SSSXXX}" } } }
        - setProperty: { name: scalaOriginalBody, expression: { simple: { expression: "${body}" } } }
        - toD: { uri: "file:/data/requests?fileName=${header.scalaJobId}.json&fileExist=Override" }
        - removeHeaders: { pattern: "CamelHttp*" }
        - setHeader: { name: Content-Type, expression: { constant: { expression: "application/json" } } }
        - setBody: { expression: { simple: { expression: '{"jobId":"${header.scalaJobId}","type":"${header.scalaJobType}","status":"QUEUED","submittedAt":"${header.scalaSubmittedAt}"}' } } }
        - toD: { uri: "file:/data/jobs?fileName=${header.scalaJobId}.json&fileExist=Override" }
        - setBody: { expression: { simple: { expression: "${exchangeProperty.scalaOriginalBody}" } } }
        - to:
            uri: "amqp:queue:scala.jobs"
            pattern: InOnly
            parameters: { deliveryPersistent: true }
        - setHeader: { name: CamelHttpResponseCode, expression: { constant: { resultType: int, expression: "202" } } }
        - setHeader: { name: Content-Type, expression: { constant: { expression: "application/json" } } }
        - setBody: { expression: { simple: { expression: '{"accepted":true,"jobId":"${header.scalaJobId}","type":"${header.scalaJobType}","status":"QUEUED"}' } } }
