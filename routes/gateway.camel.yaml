- route:
    id: scala-health
    from:
      uri: "netty-http:http://0.0.0.0:8080/health"
      parameters: { httpMethodRestrict: "GET" }
      steps:
        - setHeader: { name: Content-Type, expression: { constant: { expression: "application/json" } } }
        - setBody: { expression: { constant: { expression: '{"status":"Healthy","service":"SCALA Automation Pro","version":"3"}' } } }

- route:
    id: scala-ai-submit
    from:
      uri: "netty-http:http://0.0.0.0:8080/api/ai"
      parameters: { httpMethodRestrict: "POST" }
      steps:
        - setHeader: { name: scalaJobType, expression: { constant: { expression: "ai.generate" } } }
        - to: { uri: "direct:submit-job" }

